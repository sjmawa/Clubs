{% load static %}

<nav class="bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-20">
    <!-- Left: Logo -->
    <div class="flex items-center space-x-3">
      <a href="#">
        <img src="{% static 'images/bubt_logo.png' %}" alt="BUBT Logo" class="h-12 w-auto">
      </a>
    </div>

    <!-- Center: Menu Links -->
    <div class="hidden md:flex space-x-6 text-gray-700 font-semibold">
      <a href="{% url 'home' %} " class="hover:text-blue-700">Home</a>
      <a href="#" class="hover:text-blue-700">IQAC</a>
      <a href="{% url 'club-list' %} " class="hover:text-blue-700">Clubs</a>
      <a href="#" class="hover:text-blue-700">Contacts</a>

      <!-- Conditional Links -->
      {% if user.is_authenticated %}
        <a href="#" class="hover:text-blue-700">Profile</a>
        <a href="{% url 'sign-out' %}" class="hover:text-red-600">Logout</a>
      {% else %}
        <a href="{% url 'sign-in' %}" class="hover:text-blue-700">Login</a>
        <a href="{% url 'sign-up' %}" class="hover:text-blue-700">Register</a>
      {% endif %}
    </div>

    <!-- Right: Search -->
    <div class="flex items-center w-72">
      <input 
        type="text" 
        placeholder="Search"
        class="w-full border border-blue-400 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-300"
      />
    </div>
  </div>
</nav>
