{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="relative flex justify-center mt-5 mb-5">
  <div id="carousel" class="w-2/3 h-[420px] relative rounded-2xl shadow-md border-4 border-gray-300 overflow-hidden">
    
    <!-- Carousel slides -->
    <div class="carousel-images flex transition-transform duration-700 ease-in-out">
      <img src="{% static 'images/default_club.png' %}" class="w-full h-[420px] object-cover flex-shrink-0" />
      <img src="{% static 'images/event_1.jpg' %}" class="w-full h-[420px] object-cover flex-shrink-0" />
      <img src="{% static 'images/event_2.jpg' %}" class="w-full h-[420px] object-cover flex-shrink-0" />
    </div>

    <!-- Optional dots at bottom -->
    <div class="absolute bottom-3 left-0 right-0 flex justify-center space-x-2">
      <button class="dot w-3 h-3 bg-white/60 rounded-full"></button>
      <button class="dot w-3 h-3 bg-white/60 rounded-full"></button>
      <button class="dot w-3 h-3 bg-white/60 rounded-full"></button>
    </div>
  </div>

  <!-- Keep your background divider line -->
  <div class="absolute top-1/2 left-0 w-full h-1 bg-gray-300 -z-10"></div>
</div>

<script>
  // Simple autoplay carousel
  const carousel = document.querySelector('#carousel .carousel-images');
  const dots = document.querySelectorAll('.dot');
  const total = carousel.children.length;
  let index = 0;

  function showSlide(i) {
    carousel.style.transform = `translateX(-${i * 100}%)`;
    dots.forEach((dot, j) => {
      dot.classList.toggle('bg-white', j !== i);
      dot.classList.toggle('bg-blue-500', j === i);
    });
  }

  function nextSlide() {
    index = (index + 1) % total;
    showSlide(index);
  }

  let interval = setInterval(nextSlide, 3000); // autoplay every 3s
  showSlide(index);

  // Allow clicking dots to navigate
  dots.forEach((dot, i) => {
    dot.addEventListener('click', () => {
      clearInterval(interval);
      index = i;
      showSlide(i);
      interval = setInterval(nextSlide, 3000);
    });
  });
</script>

{% endblock %}
