{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="relative flex justify-center items-center mt-5 mb-5">
    <div class="flex flex-col items-center">
        {% if club.image %}
            <img src="{{ club.image.url }}" alt="{{ club.name }}"
                 class="max-w-[400px] max-h-[400px] object-contain rounded-2xl shadow-md border-4 border-gray-300" />
        {% else %}
            <img src="{% static 'images/default_club.png' %}" alt="{{ club.name }}"
                 class="max-w-[400px] max-h-[400px] object-contain rounded-2xl shadow-md border-4 border-gray-300" />
        {% endif %}
        <div class="mt-4 text-center">
            <p class="text-4xl font-bold">{{ club.name }}</p>
        </div>

    </div>
    <div class="absolute top-1/2 left-0 w-full h-1 bg-gray-300 -z-10"></div>
</div>
<div class="mt-4 mb-5">
    {% if club.description %}
        <p class="text-gray-700 ml-4 m-2 mx-auto">{{ club.description }}</p>
    {% else %}
        <p class="text-gray-500 italic mt-2">No description available.</p>
    {% endif %}
</div>

{% endblock %}
